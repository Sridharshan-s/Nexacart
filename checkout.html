<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NexaCart - Checkout</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            Nexa<span>Cart</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart 🛒</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <!-- Checkout -->
    <section class="checkout-section">

        <h2>Checkout</h2>

        <div class="checkout-container">

            <!-- Customer Details -->
            <div class="customer-details">

                <h3>Delivery Information</h3>

                <form id="checkout-form">

                    <label>Full Name</label>
                    <input
                        type="text"
                        id="full-name"
                        placeholder="Enter your full name"
                        required
                    >

                    <label>Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label>Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                    <label>Address</label>
                    <textarea
                        id="address"
                        placeholder="Enter your delivery address"
                        required
                    ></textarea>

                    <label>City</label>
                    <input
                        type="text"
                        id="city"
                        placeholder="Enter your city"
                        required
                    >

                    <label>PIN Code</label>
                    <input
                        type="text"
                        id="pincode"
                        placeholder="Enter PIN code"
                        required
                    >

                    <h3>Payment Method</h3>

                    <div class="payment-options">

                        <label>
                            <input
                                type="radio"
                                name="payment"
                                value="cod"
                                checked
                            >
                            Cash on Delivery
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="payment"
                                value="card"
                            >
                            Credit / Debit Card
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="payment"
                                value="upi"
                            >
                            UPI
                        </label>

                    </div>

                    <button
                        type="submit"
                        class="place-order-btn"
                    >
                        Place Order
                    </button>

                </form>

            </div>


            <!-- Order Summary -->
            <div class="order-summary">

                <h3>Order Summary</h3>

                <div id="checkout-items"></div>

                <hr>

                <div class="total-row">
                    <strong>Total</strong>

                    <strong>
                        ₹<span id="checkout-total">0</span>
                    </strong>
                </div>

            </div>

        </div>

    </section>


    <footer>

        <h3>NexaCart</h3>

        <p>Your trusted online shopping destination.</p>

        <p>© 2026 NexaCart. All rights reserved.</p>

    </footer>


    <script src="js/script.js"></script>

</body>
</html>
